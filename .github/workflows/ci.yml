# בדיקה אוטומטית לכל שינוי — לפני שהוא מגיע לנציגים.
# בנייה (כולל בדיקת טיפוסים של המסך והשרת) + בדיקות ההרשאות.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
